services:
  # ==========================================
  # Service Backend (Node.js Express)
  # ==========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: meeting_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-mysql_db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      DB_NAME: ${DB_NAME:-meeting_management}
    volumes:
      # Mount mã nguồn để hot-reload khi dev (không cần rebuild image)
      - ./server:/app
      # Giữ node_modules độc lập trong container
      - /app/node_modules
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - meeting_net

  # ==========================================
  # Service Database (MySQL 8.0)
  # ==========================================
  mysql_db:
    image: mysql:8.0
    container_name: meeting_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-meeting_management}
    volumes:
      # Volume lưu trữ bền vững dữ liệu MySQL
      - mysql_data:/var/lib/mysql
      # Tự động import schema khởi tạo lần đầu
      - ./database/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - meeting_net

# ==========================================
# Volumes
# ==========================================
volumes:
  mysql_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  meeting_net:
    driver: bridge
