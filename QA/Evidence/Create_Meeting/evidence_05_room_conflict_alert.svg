<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Validation: Chống Đặt Trùng Phòng Họp (Overlap Conflict Alert)
    </text>
    

  <g transform="translate(130, 60)" filter="url(#shadow5)">
    <rect width="640" height="500" rx="12" ry="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <rect width="640" height="50" rx="12" ry="12" fill="#f8fafc"/>
    <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Thêm cuộc họp</text>

    <!-- Title Field -->
    <g transform="translate(24, 70)">
      <text x="0" y="14" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Tiêu đề cuộc họp <tspan fill="#ef4444">*</tspan></text>
      <rect y="22" width="592" height="40" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="47" font-family="sans-serif" font-size="13" font-weight="500" fill="#0f172a">Họp phát sinh Team B</text>
    </g>

    <!-- Time Section (Valid times) -->
    <g transform="translate(24, 150)">
      <rect width="592" height="95" rx="8" ry="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">⏰ Thời gian: 28/09/2026 từ 09:00 đến 10:00 (1 giờ 0 phút)</text>
      
      <rect x="16" y="38" width="170" height="36" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="28" y="61" font-family="sans-serif" font-size="13" fill="#0f172a">2026-09-28</text>

      <rect x="200" y="38" width="170" height="36" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="212" y="61" font-family="sans-serif" font-size="13" fill="#0f172a">09:00</text>

      <rect x="384" y="38" width="170" height="36" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="396" y="61" font-family="sans-serif" font-size="13" fill="#0f172a">10:00</text>
    </g>

    <!-- Room Section (Conflict Focus) -->
    <g transform="translate(24, 265)">
      <text x="0" y="14" font-family="sans-serif" font-size="13" font-weight="600" fill="#ef4444">Phòng họp (Bị xung đột) ⚠</text>
      <rect y="22" width="592" height="42" rx="6" ry="6" fill="#fff" stroke="#ef4444" stroke-width="2"/>
      <text x="12" y="48" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">Phòng Tokyo (Tầng 4) — Sức chứa: 20 người</text>
      
      <!-- Room Conflict Box -->
      <g transform="translate(0, 80)">
        <rect width="592" height="70" rx="8" ry="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
        <circle cx="28" cy="35" r="14" fill="#e11d48"/>
        <!-- Calendar cross icon -->
        <text x="28" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">✕</text>
        <text x="54" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#9f1239">
          Xung đột lịch phòng họp (Overlap Conflict)!
        </text>
        <text x="54" y="52" font-family="sans-serif" font-size="12" fill="#be123c">
          Phòng <tspan font-weight="bold">Phòng Tokyo</tspan> đã có lịch họp: &quot;<tspan font-weight="bold">Họp Team A</tspan>&quot; (09:00 - 10:00). Vui lòng chọn giờ hoặc phòng khác.
        </text>
      </g>
    </g>

    <!-- Save Button Disabled -->
    <g transform="translate(24, 435)">
      <rect x="470" width="122" height="40" rx="6" ry="6" fill="#94a3b8"/>
      <text x="531" y="25" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff">Lưu cuộc họp</text>
      <text x="220" y="25" font-family="sans-serif" font-size="12" font-weight="600" fill="#e11d48">Hệ thống từ chối lưu đè lịch họp (HTTP 409 Conflict)</text>
    </g>
  </g>

  <!-- Evidence Tag -->
  <rect x="700" y="580" width="180" height="28" rx="4" ry="4" fill="#e11d48"/>
  <text x="790" y="598" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">EVIDENCE: TC_MEET_TIME_016</text>
</svg>