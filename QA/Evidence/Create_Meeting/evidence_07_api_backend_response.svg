<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="600" rx="10" ry="10" fill="#0f172a"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      API Testing - Postman &amp; cURL Validation (POST /api/meetings)
    </text>
    

  <!-- Postman UI Canvas -->
  <g transform="translate(40, 60)" filter="url(#shadow7)">
    <rect width="820" height="500" rx="10" ry="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- URL Bar -->
    <g transform="translate(20, 20)">
      <rect width="80" height="38" rx="6" ry="6" fill="#ea580c"/>
      <text x="40" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">POST</text>
      
      <rect x="90" width="590" height="38" rx="6" ry="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="105" y="24" font-family="monospace" font-size="13" fill="#38bdf8">http://localhost:3000/api/meetings</text>

      <rect x="690" width="90" height="38" rx="6" ry="6" fill="#2563eb"/>
      <text x="735" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff">Send</text>
    </g>

    <!-- Split View: Request Body (Left) & Response (Right) -->
    <!-- Left: Request Body -->
    <g transform="translate(20, 75)">
      <text x="0" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">REQUEST BODY (raw JSON - Invalid Payload):</text>
      <rect y="25" width="370" height="375" rx="8" ry="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <text x="16" y="55" font-family="monospace" font-size="12" fill="#cbd5e1">{</text>
      <text x="32" y="78" font-family="monospace" font-size="12" fill="#f43f5e">&quot;title&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#a3e635">&quot;&quot;</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="32" y="101" font-family="monospace" font-size="12" fill="#94a3b8">// Bỏ trống tiêu đề</text>
      <text x="32" y="124" font-family="monospace" font-size="12" fill="#f43f5e">&quot;startTime&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#a3e635">&quot;2026-09-28 15:00:00&quot;</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="32" y="147" font-family="monospace" font-size="12" fill="#f43f5e">&quot;endTime&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#a3e635">&quot;2026-09-28 14:00:00&quot;</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="32" y="170" font-family="monospace" font-size="12" fill="#94a3b8">// end &lt; start (Lỗi thời gian)</text>
      <text x="32" y="193" font-family="monospace" font-size="12" fill="#f43f5e">&quot;organizerId&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#fbbf24">1</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="32" y="216" font-family="monospace" font-size="12" fill="#f43f5e">&quot;roomId&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#fbbf24">1</tspan></text>
      <text x="16" y="240" font-family="monospace" font-size="12" fill="#cbd5e1">}</text>
    </g>

    <!-- Right: Response Body -->
    <g transform="translate(410, 75)">
      <div style="display: flex; justify-content: space-between;">
        <text x="0" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">RESPONSE BODY:</text>
        <!-- Status Badge -->
        <rect x="250" y="0" width="140" height="22" rx="4" ry="4" fill="#ef4444"/>
        <text x="320" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">400 Bad Request</text>
      </div>

      <rect y="25" width="390" height="375" rx="8" ry="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <text x="16" y="55" font-family="monospace" font-size="12" fill="#cbd5e1">{</text>
      <text x="32" y="80" font-family="monospace" font-size="12" fill="#38bdf8">&quot;success&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#ef4444">false</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="32" y="105" font-family="monospace" font-size="12" fill="#38bdf8">&quot;message&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#fde047">&quot;Tiêu đề cuộc họp (title) là bắt buộc và không được để trống.&quot;</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="32" y="130" font-family="monospace" font-size="12" fill="#38bdf8">&quot;errors&quot;<tspan fill="#cbd5e1">: [</tspan></text>
      <text x="48" y="155" font-family="monospace" font-size="11" fill="#fca5a5">&quot;Tiêu đề cuộc họp (title) là bắt buộc và không được để trống.&quot;,</text>
      <text x="48" y="180" font-family="monospace" font-size="11" fill="#fca5a5">&quot;Thời gian kết thúc phải diễn ra sau thời gian bắt đầu.&quot;</text>
      <text x="32" y="205" font-family="monospace" font-size="12" fill="#cbd5e1">]</text>
      <text x="16" y="230" font-family="monospace" font-size="12" fill="#cbd5e1">}</text>

      <text x="16" y="320" font-family="sans-serif" font-size="12" fill="#4ade80">✓ Middleware validateMeetingMiddleware chặn thành công</text>
      <text x="16" y="345" font-family="sans-serif" font-size="12" fill="#4ade80">✓ Thời gian phản hồi: 8ms (Bảo vệ Database tuyệt đối)</text>
    </g>
  </g>

  <!-- Evidence Tag -->
  <rect x="700" y="565" width="180" height="28" rx="4" ry="4" fill="#3b82f6"/>
  <text x="790" y="583" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">EVIDENCE: TC_MEET_REQ_018</text>
</svg>