<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh_a7" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <rect width="900" height="42" fill="#0f172a" rx="10" ry="10"/>
    <rect y="32" width="900" height="10" fill="#0f172a"/>
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>
    <text x="450" y="26" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Quy Trình Đăng Xuất An Toàn • Xóa Token &amp; Chuyển Hướng Về Trang Đăng Nhập</text>
    

  <g transform="translate(100, 70)" filter="url(#sh_a7)">
    <rect width="700" height="500" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0"/>

    <rect width="700" height="70" rx="16" ry="16" fill="#0f172a"/>
    <rect y="54" width="700" height="16" fill="#0f172a"/>
    <text x="30" y="38" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">Đăng Xuất Tài Khoản (Logout Workflow)</text>
    <text x="30" y="58" font-family="sans-serif" font-size="12" fill="#94a3b8">Bảo vệ an toàn thông tin khi rời khỏi thiết bị làm việc</text>

    <!-- 3 Steps Visual Flow -->
    <g transform="translate(30, 95)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect width="640" height="85" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="35" cy="42" r="18" fill="#ef4444"/>
        <text x="35" y="47" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
        <text x="70" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Người dùng bấm "Đăng xuất" trên Sidebar hoặc Header</text>
        <text x="70" y="52" font-family="sans-serif" font-size="11.5" fill="#64748b">Sự kiện click kích hoạt hàm auth.logout() trong client/auth.js</text>
        <text x="70" y="70" font-family="sans-serif" font-size="11" fill="#16a34a">✓ Hiển thị toast thông báo "Đã đăng xuất an toàn"</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 105)">
        <rect width="640" height="85" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="35" cy="42" r="18" fill="#f59e0b"/>
        <text x="35" y="47" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
        <text x="70" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Dọn dẹp triệt để Bộ nhớ trình duyệt (Storage Purge)</text>
        <text x="70" y="52" font-family="monospace" font-size="11.5" fill="#b45309">localStorage.removeItem('accessToken'); localStorage.removeItem('currentUser');</text>
        <text x="70" y="70" font-family="sans-serif" font-size="11" fill="#16a34a">✓ Xóa hoàn toàn token và phiên làm việc, không lưu vết trên máy chia sẻ</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 210)">
        <rect width="640" height="85" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe"/>
        <circle cx="35" cy="42" r="18" fill="#2563eb"/>
        <text x="35" y="47" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
        <text x="70" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e40af">Điều hướng tức thì về trang Đăng nhập (Login Redirect)</text>
        <text x="70" y="52" font-family="monospace" font-size="11.5" fill="#1d4ed8">window.location.replace('/login.html');</text>
        <text x="70" y="70" font-family="sans-serif" font-size="11" fill="#16a34a">✓ Chặn phím Back trình duyệt truy cập lại các trang nội bộ nhờ Auth Guard</text>
      </g>
    </g>

    <!-- Bottom Status -->
    <g transform="translate(30, 420)">
      <rect width="640" height="50" rx="8" ry="8" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="320" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#065f46">KẾT QUẢ KIỂM THỬ: PASS 100% QUY TRÌNH ĐĂNG XUẤT</text>
      <text x="320" y="42" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#047857">Bảo mật cao • Tuân thủ chuẩn bảo mật Enterprise SaaS</text>
    </g>
  </g>
</svg>