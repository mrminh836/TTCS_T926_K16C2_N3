<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh_a2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <rect width="900" height="42" fill="#0f172a" rx="10" ry="10"/>
    <rect y="32" width="900" height="10" fill="#0f172a"/>
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>
    <text x="450" y="26" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Kiểm Thử Ca Xung Đột • Chặn Đăng Ký Trùng Email / Username (HTTP 409 Conflict)</text>
    

  <g transform="translate(150, 70)" filter="url(#sh_a2)">
    <rect width="600" height="500" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Header -->
    <rect width="600" height="80" rx="16" ry="16" fill="#0f172a"/>
    <rect y="64" width="600" height="16" fill="#0f172a"/>
    <text x="30" y="38" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">Đăng Ký Tài Khoản - Báo Lỗi Trùng Lặp</text>
    <text x="30" y="62" font-family="sans-serif" font-size="12" fill="#94a3b8">Bảo vệ tính duy nhất của danh tính nhân viên trong toàn hệ sinh thái</text>

    <!-- Error Alert Box 409 -->
    <g transform="translate(30, 95)">
      <rect width="540" height="60" rx="8" ry="8" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="28" cy="30" r="14" fill="#ef4444"/>
      <text x="28" y="35" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">!</text>
      <text x="54" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#991b1b">Lỗi đăng ký: Trùng lặp dữ liệu (HTTP 409 Conflict)</text>
      <text x="54" y="45" font-family="sans-serif" font-size="11.5" fill="#b91c1c">"Địa chỉ email đã được đăng ký trên hệ thống. Vui lòng sử dụng email khác."</text>
    </g>

    <!-- Form with Red Highlight on Email -->
    <g transform="translate(30, 175)">
      <text x="0" y="15" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Họ và tên</text>
      <rect y="24" width="540" height="38" rx="6" ry="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="14" y="48" font-family="sans-serif" font-size="13" fill="#0f172a">Nguyễn Văn Quản Trị</text>

      <g transform="translate(0, 75)">
        <text x="0" y="15" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Tên đăng nhập (Username)</text>
        <rect y="24" width="255" height="38" rx="6" ry="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="14" y="48" font-family="sans-serif" font-size="13" fill="#0f172a">admin_backup</text>

        <text x="285" y="15" font-family="sans-serif" font-size="12" font-weight="700" fill="#dc2626">Email (Đã tồn tại trong DB) ⚠️</text>
        <rect x="285" y="24" width="255" height="38" rx="6" ry="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
        <text x="299" y="48" font-family="sans-serif" font-size="13" font-weight="600" fill="#be123c">admin@enterprise.vn</text>
      </g>

      <!-- SQL Duplicate Key Check Description -->
      <g transform="translate(0, 160)">
        <rect width="540" height="65" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="14" y="22" font-family="monospace" font-size="11" fill="#334155">Query: SELECT UserID FROM Users WHERE Email = ? LIMIT 1;</text>
        <text x="14" y="40" font-family="sans-serif" font-size="11" fill="#64748b">→ Tìm thấy UserID = 1 ("admin"). Ném Exception 409 Conflict trước khi INSERT.</text>
        <text x="14" y="55" font-family="sans-serif" font-size="10.5" fill="#16a34a">✓ Bảo vệ toàn vẹn UNIQUE constraint, không sinh rác CSDL.</text>
      </g>
    </g>

    <!-- Submit Button Disabled -->
    <g transform="translate(30, 440)">
      <rect width="540" height="42" rx="8" ry="8" fill="#e2e8f0"/>
      <text x="270" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Đăng ký tài khoản (Bị chặn)</text>
    </g>
  </g>
</svg>