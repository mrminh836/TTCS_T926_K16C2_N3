<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh_a6" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <rect width="900" height="42" fill="#0f172a" rx="10" ry="10"/>
    <rect y="32" width="900" height="10" fill="#0f172a"/>
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>
    <text x="450" y="26" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Kiểm Thử Chặn Bảo Mật • Thiếu Token Hoặc Token Hết Hạn (HTTP 401 Unauthorized)</text>
    

  <g transform="translate(60, 70)" filter="url(#sh_a6)">
    <rect width="780" height="500" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Header -->
    <rect width="780" height="60" rx="16" ry="16" fill="#991b1b"/>
    <rect y="45" width="780" height="15" fill="#991b1b"/>
    <text x="30" y="38" font-family="sans-serif" font-size="18" font-weight="800" fill="#ffffff">Auth Guard &amp; Middleware Security Block</text>

    <!-- Case 1: Missing Token -->
    <g transform="translate(30, 80)">
      <rect width="720" height="175" rx="10" ry="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="15" y="15" width="130" height="24" rx="4" ry="4" fill="#fee2e2"/>
      <text x="24" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#b91c1c">CA 1: THIẾU TOKEN</text>

      <text x="160" y="32" font-family="monospace" font-size="12" fill="#334155">GET /api/meetings (Không kèm Header Authorization)</text>
      
      <rect x="15" y="50" width="690" height="50" rx="6" ry="6" fill="#ffffff" stroke="#fca5a5"/>
      <text x="30" y="70" font-family="monospace" font-size="11.5" fill="#dc2626">HTTP/1.1 401 Unauthorized</text>
      <text x="30" y="88" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">&#123; "success": false, "message": "Yêu cầu token xác thực. Vui lòng cung cấp Authorization header." &#125;</text>
      
      <text x="15" y="125" font-family="sans-serif" font-size="11" fill="#64748b">Cơ chế: authMiddleware chặn ngay ở tầng đầu tiên, không truy vấn CSDL, tiết kiệm tài nguyên máy chủ.</text>
      <text x="15" y="145" font-family="sans-serif" font-size="11" font-weight="600" fill="#16a34a">✓ Đạt chuẩn bảo vệ API Restful</text>
    </g>

    <!-- Case 2: Expired Token -->
    <g transform="translate(30, 275)">
      <rect width="720" height="195" rx="10" ry="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="15" y="15" width="150" height="24" rx="4" ry="4" fill="#fef3c7"/>
      <text x="24" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#92400e">CA 2: TOKEN HẾT HẠN</text>

      <text x="180" y="32" font-family="monospace" font-size="12" fill="#334155">Authorization: Bearer &lt;expired_jwt_token_over_24h&gt;</text>

      <rect x="15" y="50" width="690" height="50" rx="6" ry="6" fill="#ffffff" stroke="#fde68a"/>
      <text x="30" y="70" font-family="monospace" font-size="11.5" fill="#d97706">HTTP/1.1 401 Unauthorized (TokenExpiredError)</text>
      <text x="30" y="88" font-family="sans-serif" font-size="11.5" fill="#78350f">&#123; "success": false, "message": "Token xác thực không hợp lệ hoặc đã hết hạn." &#125;</text>

      <text x="15" y="125" font-family="sans-serif" font-size="11" fill="#64748b">Phía Client: Phát hiện 401 TokenExpired $ightarrow$ Kích hoạt hàm auth.logout() $ightarrow$ Tự động chuyển về login.html.</text>
      <text x="15" y="145" font-family="sans-serif" font-size="11" font-weight="600" fill="#16a34a">✓ Phiên làm việc được bảo vệ nghiêm ngặt theo thời hạn jwtExpiresIn = 24h.</text>
    </g>
  </g>
</svg>