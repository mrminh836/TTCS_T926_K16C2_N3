<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640">
  <defs>
    <filter id="shadow_ovl" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="920" height="640" rx="12" ry="12" fill="#0f172a"/>

  <!-- Window Bar -->
  <rect width="920" height="42" rx="12" ry="12" fill="#1e293b"/>
  <rect y="32" width="920" height="10" fill="#1e293b"/>
  <circle cx="20" cy="21" r="6" fill="#ef4444"/>
  <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="6" fill="#10b981"/>
  <text x="460" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
    Minh Chứng: Chặn Mượn Thiết Bị Trùng Giờ Giữa Các Phòng (Equipment Overlap - TC_EQ_OVL_001 &amp; 002)
  </text>

  <!-- Container -->
  <g transform="translate(40, 65)" filter="url(#shadow_ovl)">
    <rect width="840" height="545" rx="12" ry="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <!-- Top Section: Time Conflict Timeline Chart -->
    <g transform="translate(24, 20)">
      <rect width="792" height="185" rx="10" ry="10" fill="#0f172a" stroke="#334155"/>
      <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
        ⏱️ Sơ Đồ Xung Đột Thời Gian Mượn Thiết Bị (Máy Chiếu Full HD - ID: 1):
      </text>

      <!-- Time Axis -->
      <g transform="translate(40, 48)">
        <!-- Timeline Background -->
        <line x1="120" y1="20" x2="680" y2="20" stroke="#475569" stroke-width="2"/>
        <circle cx="150" cy="20" r="4" fill="#94a3b8"/>
        <text x="150" y="10" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">09:00</text>
        
        <circle cx="320" cy="20" r="4" fill="#94a3b8"/>
        <text x="320" y="10" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">09:30</text>

        <circle cx="490" cy="20" r="4" fill="#94a3b8"/>
        <text x="490" y="10" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">10:00</text>

        <circle cx="660" cy="20" r="4" fill="#94a3b8"/>
        <text x="660" y="10" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">10:30</text>

        <!-- Meeting A (Tokyo Room - Confirmed) -->
        <g transform="translate(0, 32)">
          <text x="0" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Họp A (Phòng Tokyo):</text>
          <rect x="150" y="4" width="340" height="22" rx="4" fill="#166534" stroke="#22c55e"/>
          <text x="320" y="19" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">
            ✓ ĐÃ XÁC NHẬN (09:00 - 10:00) • Đang giữ Máy chiếu 1
          </text>
        </g>

        <!-- Meeting B (Silicon Room - Trying to book - CONFLICT) -->
        <g transform="translate(0, 68)">
          <text x="0" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Họp B (Phòng Silicon):</text>
          <rect x="320" y="4" width="340" height="22" rx="4" fill="#991b1b" stroke="#ef4444"/>
          <text x="490" y="19" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">
            ⛔ YÊU CẦU MỚI (09:30 - 10:30) • Chọn cùng Máy chiếu 1
          </text>
        </g>

        <!-- Red Conflict Zone Highlight -->
        <rect x="320" y="32" width="170" height="60" rx="4" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-dasharray="4 2"/>
        <text x="405" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">
          ⚠️ VÙNG XUNG ĐỘT: 09:30 - 10:00 (Giao thoa 30 phút)
        </text>
      </g>
    </g>

    <!-- Bottom Left: API Conflict Rejection Details -->
    <g transform="translate(24, 220)">
      <rect width="385" height="305" rx="10" ry="10" fill="#020617" stroke="#334155"/>
      <rect width="385" height="36" rx="10" ry="10" fill="#0f172a"/>
      <rect y="30" width="385" height="6" fill="#0f172a"/>
      <rect x="12" y="7" width="55" height="22" rx="4" fill="#ef4444"/>
      <text x="39" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">POST</text>
      <text x="76" y="22" font-family="monospace" font-size="11" fill="#38bdf8">/api/meetings (Silicon Room)</text>

      <g transform="translate(14, 46)">
        <rect width="115" height="24" rx="4" fill="#7f1d1d"/>
        <text x="71" y="62" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fca5a5">409 CONFLICT</text>
        
        <rect x="125" y="0" width="155" height="24" rx="4" fill="#b45309"/>
        <text x="202" y="16" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fef08a">TX ROLLBACK SUCCEED</text>
      </g>

      <g transform="translate(14, 82)">
        <text x="0" y="14" font-family="monospace" font-size="11" fill="#64748b">// Response JSON Phản Hồi Xung Đột:</text>
        <text x="0" y="32" font-family="monospace" font-size="11" fill="#f8fafc">{</text>
        <text x="16" y="50" font-family="monospace" font-size="11" fill="#38bdf8">"success"</text><text x="76" y="50" font-family="monospace" font-size="11" fill="#f8fafc">: </text><text x="90" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#ef4444">false</text><text x="126" y="50" font-family="monospace" font-size="11" fill="#f8fafc">,</text>
        <text x="16" y="70" font-family="monospace" font-size="11" fill="#38bdf8">"message"</text><text x="76" y="70" font-family="monospace" font-size="11" fill="#f8fafc">: </text>
        <text x="16" y="90" font-family="monospace" font-size="11" font-weight="600" fill="#fca5a5">"Thiết bị 'Máy chiếu Full HD'</text>
        <text x="16" y="108" font-family="monospace" font-size="11" font-weight="600" fill="#fca5a5"> đã có cuộc họp khác mượn</text>
        <text x="16" y="126" font-family="monospace" font-size="11" font-weight="600" fill="#fca5a5"> trong khung giờ này."</text><text x="175" y="126" font-family="monospace" font-size="11" fill="#f8fafc">,</text>
        <text x="16" y="150" font-family="monospace" font-size="11" fill="#38bdf8">"conflictDetails"</text><text x="135" y="150" font-family="monospace" font-size="11" fill="#f8fafc">: {</text>
        <text x="32" y="170" font-family="monospace" font-size="11" fill="#94a3b8">"occupiedByRoom": "Phòng Tokyo",</text>
        <text x="32" y="188" font-family="monospace" font-size="11" fill="#94a3b8">"occupiedUntil": "10:00:00"</text>
        <text x="16" y="206" font-family="monospace" font-size="11" fill="#f8fafc">}</text>
        <text x="0" y="224" font-family="monospace" font-size="11" fill="#f8fafc">}</text>
      </g>
    </g>

    <!-- Bottom Right: Concurrency & Lock Mechanism Verification -->
    <g transform="translate(425, 220)">
      <rect width="391" height="305" rx="10" ry="10" fill="#0f172a" stroke="#334155"/>
      <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
        🛡️ Cơ Chế Bảo Vệ Toàn Vẹn CSDL:
      </text>

      <g transform="translate(16, 42)">
        <rect width="359" height="70" rx="6" fill="#1e293b"/>
        <text x="14" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">1. Khóa Chống Trùng Đặt (Pessimistic Locking):</text>
        <text x="14" y="38" font-family="monospace" font-size="10" fill="#94a3b8">SELECT ... FROM Booking_Equipments FOR UPDATE</text>
        <text x="14" y="56" font-family="sans-serif" font-size="10" fill="#34d399">✓ Ngăn ngừa hoàn toàn Race Condition khi đặt cùng giây</text>
      </g>

      <g transform="translate(16, 122)">
        <rect width="359" height="70" rx="6" fill="#1e293b"/>
        <text x="14" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">2. Nguyên Tắc Rollback Toàn Bộ (All-or-Nothing):</text>
        <text x="14" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8">Khi thiết bị trùng giờ ➔ Hủy luôn Meeting &amp; Booking phòng</text>
        <text x="14" y="56" font-family="sans-serif" font-size="10" fill="#4ade80">✓ Không tạo cuộc họp phòng trống bị thiếu thiết bị</text>
      </g>

      <g transform="translate(16, 202)">
        <rect width="359" height="85" rx="6" fill="#064e3b" stroke="#059669"/>
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">3. KẾT QUẢ ĐỐI SOÁT CSDL: PASS ✓</text>
        <text x="14" y="42" font-family="monospace" font-size="11" fill="#f8fafc">• Số bản ghi trùng giờ (Duplicate Equipments): 0</text>
        <text x="14" y="60" font-family="monospace" font-size="11" fill="#f8fafc">• Số booking mồ côi (Orphan Bookings): 0</text>
        <text x="14" y="76" font-family="sans-serif" font-size="10" fill="#a7f3d0">Đảm bảo tuyệt đối 1 thiết bị chỉ ở 1 phòng họp tại 1 thời điểm.</text>
      </g>
    </g>
  </g>
</svg>
