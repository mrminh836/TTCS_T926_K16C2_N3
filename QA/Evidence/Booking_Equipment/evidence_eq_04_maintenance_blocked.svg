<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640">
  <defs>
    <filter id="shadow_maint" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="920" height="640" rx="12" ry="12" fill="#0f172a"/>

  <!-- Window Bar -->
  <rect width="920" height="42" rx="12" ry="12" fill="#1e293b"/>
  <rect y="32" width="920" height="10" fill="#1e293b"/>
  <circle cx="20" cy="21" r="6" fill="#ef4444"/>
  <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="6" fill="#10b981"/>
  <text x="460" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
    Minh Chứng: Chặn Mượn Thiết Bị Đang Bảo Trì (Status = 'Maintenance' - TC_EQ_MAINT_001 &amp; 003)
  </text>

  <!-- Container -->
  <g transform="translate(45, 65)" filter="url(#shadow_maint)">
    <rect width="830" height="545" rx="12" ry="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <!-- Left Column: Frontend UI Modal with Disabled Equipment -->
    <g transform="translate(20, 20)">
      <rect width="385" height="505" rx="10" ry="10" fill="#ffffff" stroke="#e2e8f0"/>
      
      <!-- Modal Header -->
      <rect width="385" height="48" rx="10" ry="10" fill="#f8fafc"/>
      <rect y="40" width="385" height="8" fill="#f8fafc"/>
      <text x="16" y="30" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Đặt phòng họp &amp; Chọn thiết bị</text>
      <circle cx="360" cy="24" r="12" fill="#f1f5f9"/>
      <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b">×</text>

      <!-- Form Inputs -->
      <g transform="translate(16, 60)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569">Tiêu đề cuộc họp:</text>
        <rect y="22" width="350" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="10" y="42" font-family="sans-serif" font-size="12" fill="#0f172a">Họp Khẩn Cấp Bàn Giao K16</text>

        <text x="0" y="74" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569">Thời gian: 09:00 - 10:30 (Phòng Tokyo)</text>

        <!-- Equipment Selection Group -->
        <text x="0" y="105" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Danh sách thiết bị sẵn có:</text>

        <!-- Equipment 1: Available (Checked) -->
        <g transform="translate(0, 118)">
          <rect width="350" height="44" rx="6" fill="#f0fdf4" stroke="#86efac"/>
          <rect x="12" y="14" width="16" height="16" rx="4" fill="#16a34a"/>
          <path d="M15 22 L19 26 L25 18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <text x="38" y="26" font-family="sans-serif" font-size="12" font-weight="600" fill="#166534">Máy chiếu Full HD (ID: 1)</text>
          <rect x="260" y="12" width="75" height="20" rx="10" fill="#dcfce7"/>
          <text x="297" y="26" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#15803d">SẴN SÀNG</text>
        </g>

        <!-- Equipment 2: MAINTENANCE (Disabled & Warning) -->
        <g transform="translate(0, 170)">
          <rect width="350" height="52" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
          <rect x="12" y="18" width="16" height="16" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
          <line x1="12" y1="18" x2="28" y2="34" stroke="#ef4444" stroke-width="2"/>
          <text x="38" y="27" font-family="sans-serif" font-size="12" font-weight="700" fill="#9a3412">Màn hình TV 75" (ID: 2)</text>
          <text x="38" y="42" font-family="sans-serif" font-size="10" fill="#c2410c">⚠️ Đang thay nguồn hiển thị</text>
          
          <!-- Badge Maintenance -->
          <rect x="250" y="16" width="88" height="20" rx="10" fill="#ffedd5"/>
          <text x="294" y="30" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#c2410c">ĐANG BẢO TRÌ</text>
        </g>

        <!-- Equipment 3: Available -->
        <g transform="translate(0, 230)">
          <rect width="350" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
          <rect x="12" y="14" width="16" height="16" rx="4" fill="#ffffff" stroke="#94a3b8"/>
          <text x="38" y="26" font-family="sans-serif" font-size="12" fill="#334155">Micro &amp; Loa họp (ID: 3)</text>
          <rect x="260" y="12" width="75" height="20" rx="10" fill="#f1f5f9"/>
          <text x="297" y="26" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">SẴN SÀNG</text>
        </g>

        <!-- Toast Alert Blocked on UI -->
        <g transform="translate(0, 290)">
          <rect width="350" height="54" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
          <circle cx="24" cy="27" r="10" fill="#ef4444"/>
          <text x="24" y="31" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">!</text>
          <text x="44" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#991b1b">Không thể mượn thiết bị:</text>
          <text x="44" y="38" font-family="sans-serif" font-size="10" fill="#b91c1c">Màn hình TV 75" đang bảo trì đến 18:00 hôm nay.</text>
        </g>

        <!-- Submit Button -->
        <rect y="360" width="350" height="38" rx="6" fill="#94a3b8"/>
        <text x="175" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Xác nhận đặt lịch (Bị vô hiệu hóa)</text>
      </g>
    </g>

    <!-- Right Column: Backend API Block & DB Verification -->
    <g transform="translate(425, 20)">
      <!-- API Request & Response Simulation -->
      <rect width="385" height="280" rx="10" ry="10" fill="#020617" stroke="#334155"/>
      
      <!-- Top URL Bar -->
      <rect width="385" height="36" rx="10" ry="10" fill="#0f172a"/>
      <rect y="30" width="385" height="6" fill="#0f172a"/>
      <rect x="12" y="7" width="60" height="22" rx="4" fill="#3b82f6"/>
      <text x="42" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">POST</text>
      <text x="80" y="22" font-family="monospace" font-size="11" fill="#38bdf8">/api/meetings (equipmentIds: [2])</text>

      <!-- Response Status -->
      <g transform="translate(14, 46)">
        <rect width="130" height="24" rx="4" fill="#7f1d1d"/>
        <text x="79" y="62" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fca5a5">400 BAD REQUEST</text>
        
        <rect x="140" y="0" width="135" height="24" rx="4" fill="#b45309"/>
        <text x="207" y="16" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fef08a">ROLLBACK EXEC</text>
      </g>

      <!-- JSON Payload Response -->
      <g transform="translate(14, 80)">
        <text x="0" y="14" font-family="monospace" font-size="11" fill="#64748b">// Response JSON từ Backend API:</text>
        <text x="0" y="32" font-family="monospace" font-size="11" fill="#f8fafc">{</text>
        <text x="16" y="50" font-family="monospace" font-size="11" fill="#38bdf8">"success"</text><text x="76" y="50" font-family="monospace" font-size="11" fill="#f8fafc">: </text><text x="90" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#ef4444">false</text><text x="126" y="50" font-family="monospace" font-size="11" fill="#f8fafc">,</text>
        <text x="16" y="70" font-family="monospace" font-size="11" fill="#38bdf8">"message"</text><text x="76" y="70" font-family="monospace" font-size="11" fill="#f8fafc">: </text>
        <text x="16" y="88" font-family="monospace" font-size="11" font-weight="600" fill="#fca5a5">"Thiết bị 'Màn hình TV 75 inch'</text>
        <text x="16" y="104" font-family="monospace" font-size="11" font-weight="600" fill="#fca5a5"> hiện đang ở trạng thái bảo trì,</text>
        <text x="16" y="120" font-family="monospace" font-size="11" font-weight="600" fill="#fca5a5"> không thể mượn."</text><text x="160" y="120" font-family="monospace" font-size="11" fill="#f8fafc">,</text>
        <text x="16" y="140" font-family="monospace" font-size="11" fill="#38bdf8">"errorCode"</text><text x="90" y="140" font-family="monospace" font-size="11" fill="#f8fafc">: </text><text x="105" y="140" font-family="monospace" font-size="11" fill="#fde047">"EQUIPMENT_MAINTENANCE"</text>
        <text x="0" y="160" font-family="monospace" font-size="11" fill="#f8fafc">}</text>
      </g>

      <!-- Bottom Card: Database Integrity Audit -->
      <g transform="translate(0, 292)">
        <rect width="385" height="213" rx="10" ry="10" fill="#0f172a" stroke="#334155"/>
        <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
          🔍 Đối Soát Cơ Sở Dữ Liệu (DB Audit):
        </text>

        <rect x="16" y="38" width="353" height="44" rx="6" fill="#1e293b"/>
        <text x="26" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">Bảng Equipments (Trạng thái thiết bị):</text>
        <text x="26" y="72" font-family="monospace" font-size="11" font-weight="600" fill="#fbbf24">ID: 2 | EquipmentName: 'TV 75\"' | Status: 'Maintenance'</text>

        <rect x="16" y="90" width="353" height="52" rx="6" fill="#1e293b"/>
        <text x="26" y="107" font-family="sans-serif" font-size="11" fill="#94a3b8">Kiểm tra bảng Booking_Equipments:</text>
        <text x="26" y="125" font-family="monospace" font-size="12" font-weight="700" fill="#4ade80">SELECT COUNT(*) FROM Booking_Equipments = 0</text>
        <text x="26" y="137" font-family="sans-serif" font-size="10" fill="#94a3b8">✓ Hoàn toàn không ghi nhận dòng mồ côi</text>

        <rect x="16" y="150" width="353" height="48" rx="6" fill="#064e3b" stroke="#059669"/>
        <text x="26" y="168" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">KẾT LUẬN KIỂM THỬ: PASS ✓</text>
        <text x="26" y="184" font-family="sans-serif" font-size="10" fill="#a7f3d0">Cơ chế chặn thiết bị bảo trì hoạt động chuẩn xác từ UI tới DB.</text>
      </g>
    </g>
  </g>
</svg>
