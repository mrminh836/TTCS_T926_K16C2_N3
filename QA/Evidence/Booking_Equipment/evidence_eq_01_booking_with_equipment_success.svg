<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <defs>
    <filter id="shadow_eq1" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="640" rx="12" ry="12" fill="#0f172a"/>

  <!-- Window Bar -->
  <rect width="900" height="42" rx="12" ry="12" fill="#1e293b"/>
  <rect y="32" width="900" height="10" fill="#1e293b"/>
  <circle cx="20" cy="21" r="6" fill="#ef4444"/>
  <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="6" fill="#10b981"/>
  <text x="450" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
    Minh Chứng 01: Đặt Lịch Họp Kèm Thiết Bị Thành Công (Happy Path - EQBK-001 &amp; EQBK-002)
  </text>

  <!-- Modal Container -->
  <g transform="translate(60, 65)" filter="url(#shadow_eq1)">
    <rect width="780" height="540" rx="12" ry="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Modal Header -->
    <rect width="780" height="56" rx="12" ry="12" fill="#f8fafc"/>
    <rect y="46" width="780" height="10" fill="#f8fafc"/>
    <text x="24" y="35" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">📅 Đặt phòng họp kèm thiết bị hội nghị</text>
    <circle cx="750" cy="28" r="14" fill="#f1f5f9"/>
    <text x="750" y="33" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">×</text>

    <!-- Left Column: Form Details -->
    <g transform="translate(24, 75)">
      <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Tiêu đề cuộc họp:</text>
      <rect y="22" width="350" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="45" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Họp Báo Cáo Sprint &amp; Demo Thiết Bị</text>

      <text x="0" y="78" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Thời gian bắt đầu:</text>
      <rect y="86" width="350" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="109" font-family="sans-serif" font-size="13" fill="#0f172a">2099-02-01 09:00:00</text>

      <text x="0" y="142" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Thời gian kết thúc:</text>
      <rect y="150" width="350" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="173" font-family="sans-serif" font-size="13" fill="#0f172a">2099-02-01 10:30:00</text>

      <text x="0" y="206" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Phòng họp đã chọn:</text>
      <rect y="214" width="350" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text x="12" y="237" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">Phòng Tokyo (Tầng 4) - Sức chứa: 20</text>

      <text x="0" y="270" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Thiết bị kèm theo (Equipments Multi-select):</text>
      
      <rect y="280" width="350" height="34" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <rect x="10" y="289" width="16" height="16" rx="4" fill="#16a34a"/>
      <path d="M13 297 L17 301 L23 293" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="302" font-family="sans-serif" font-size="12" font-weight="600" fill="#166534">Máy chiếu Full HD (ID: 1) - Visual</text>

      <rect y="322" width="350" height="34" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <rect x="10" y="331" width="16" height="16" rx="4" fill="#16a34a"/>
      <path d="M13 339 L17 343 L23 335" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="344" font-family="sans-serif" font-size="12" font-weight="600" fill="#166534">Micro &amp; Loa họp (ID: 3) - Audio</text>

      <rect y="364" width="350" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="10" y="373" width="16" height="16" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="36" y="386" font-family="sans-serif" font-size="12" fill="#64748b">Màn hình TV 75" (ID: 2) - Display</text>
    </g>

    <!-- Right Column: Success Response & DB Sync Card -->
    <g transform="translate(400, 75)">
      <rect width="356" height="440" rx="10" ry="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      
      <circle cx="178" cy="45" r="26" fill="#16a34a"/>
      <path d="M168 45 L175 52 L188 38" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      
      <text x="178" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#14532d">
        ĐẶT PHÒNG THÀNH CÔNG!
      </text>
      <text x="178" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">
        HTTP 201 Created • Transaction Committed
      </text>

      <g transform="translate(18, 125)">
        <rect width="320" height="175" rx="8" ry="8" fill="#0f172a"/>
        <text x="14" y="24" font-family="monospace" font-size="11" fill="#38bdf8">// API Response Data:</text>
        <text x="14" y="46" font-family="monospace" font-size="12" fill="#f8fafc">{</text>
        <text x="28" y="66" font-family="monospace" font-size="12" fill="#38bdf8">"success"</text><text x="96" y="66" font-family="monospace" font-size="12" fill="#f8fafc">: </text><text x="110" y="66" font-family="monospace" font-size="12" fill="#4ade80">true</text><text x="140" y="66" font-family="monospace" font-size="12" fill="#f8fafc">,</text>
        <text x="28" y="86" font-family="monospace" font-size="12" fill="#38bdf8">"bookingId"</text><text x="112" y="86" font-family="monospace" font-size="12" fill="#f8fafc">: </text><text x="126" y="86" font-family="monospace" font-size="12" fill="#facc15">28</text><text x="146" y="86" font-family="monospace" font-size="12" fill="#f8fafc">,</text>
        <text x="28" y="106" font-family="monospace" font-size="12" fill="#38bdf8">"roomId"</text><text x="88" y="106" font-family="monospace" font-size="12" fill="#f8fafc">: </text><text x="102" y="106" font-family="monospace" font-size="12" fill="#facc15">1</text><text x="112" y="106" font-family="monospace" font-size="12" fill="#f8fafc">,</text>
        <text x="28" y="126" font-family="monospace" font-size="12" fill="#38bdf8">"equipmentCount"</text><text x="150" y="126" font-family="monospace" font-size="12" fill="#f8fafc">: </text><text x="164" y="126" font-family="monospace" font-size="12" fill="#4ade80">2</text><text x="174" y="126" font-family="monospace" font-size="12" fill="#f8fafc">,</text>
        <text x="28" y="146" font-family="monospace" font-size="12" fill="#38bdf8">"roomName"</text><text x="106" y="146" font-family="monospace" font-size="12" fill="#f8fafc">: </text><text x="120" y="146" font-family="monospace" font-size="12" fill="#fde047">"Phòng Tokyo"</text>
        <text x="14" y="164" font-family="monospace" font-size="12" fill="#f8fafc">}</text>
      </g>

      <g transform="translate(18, 312)">
        <rect width="320" height="110" rx="8" ry="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
        <text x="14" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803d">🔍 Đối soát CSDL (Booking_Equipments):</text>
        <text x="14" y="44" font-family="monospace" font-size="11" fill="#334155">• Row 1: BookingID=28, EquipmentID=1 (Qty=1)</text>
        <text x="14" y="64" font-family="monospace" font-size="11" fill="#334155">• Row 2: BookingID=28, EquipmentID=3 (Qty=1)</text>
        <text x="14" y="88" font-family="sans-serif" font-size="11" font-weight="600" fill="#16a34a">✓ Khóa ngoại chuẩn • Không trùng lặp • Quantity=1</text>
      </g>
    </g>
  </g>
</svg>
