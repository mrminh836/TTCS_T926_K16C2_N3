  <rect x="680" y="565" width="200" height="28" rx="4" ry="4" fill="#0284c7"/>
  <text x="780" y="583" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">EVIDENCE: TC_EDIT_API_001</text>
