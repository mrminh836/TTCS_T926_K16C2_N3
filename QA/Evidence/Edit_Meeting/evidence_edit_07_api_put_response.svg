      <text x="16" y="55" font-family="monospace" font-size="12" fill="#cbd5e1">{</text>
      <text x="32" y="80" font-family="monospace" font-size="12" fill="#38bdf8">&quot;message&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#a3e635">&quot;Cập nhật cuộc họp thành công&quot;</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="32" y="105" font-family="monospace" font-size="12" fill="#38bdf8">&quot;data&quot;<tspan fill="#cbd5e1">: {</tspan></text>
      <text x="48" y="130" font-family="monospace" font-size="11" fill="#38bdf8">&quot;meetingId&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#fbbf24">1</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="48" y="155" font-family="monospace" font-size="11" fill="#38bdf8">&quot;title&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#a3e635">&quot;Họp Sprint Review K16 (Cập nhật)&quot;</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="48" y="180" font-family="monospace" font-size="11" fill="#38bdf8">&quot;roomId&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#fbbf24">2</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="48" y="205" font-family="monospace" font-size="11" fill="#38bdf8">&quot;startTime&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#a3e635">&quot;2026-10-10 14:00:00&quot;</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="48" y="230" font-family="monospace" font-size="11" fill="#38bdf8">&quot;endTime&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#a3e635">&quot;2026-10-10 15:30:00&quot;</tspan></text>
      <text x="32" y="255" font-family="monospace" font-size="12" fill="#cbd5e1">}</text>
      <text x="16" y="280" font-family="monospace" font-size="12" fill="#cbd5e1">}</text>

      <text x="16" y="325" font-family="sans-serif" font-size="12" fill="#4ade80">✓ Cập nhật Meetings &amp; Bookings trong 1 Transaction an toàn</text>
      <text x="16" y="350" font-family="sans-serif" font-size="12" fill="#4ade80">✓ Kiểm tra 404 nếu ID không tồn tại, 409 nếu trùng phòng</text>
    </g>
