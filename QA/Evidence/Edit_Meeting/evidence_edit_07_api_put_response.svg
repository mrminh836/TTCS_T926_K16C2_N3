      <text x="32" y="193" font-family="monospace" font-size="12" fill="#38bdf8">&quot;isRecurring&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#f43f5e">false</tspan></text>
      <text x="16" y="216" font-family="monospace" font-size="12" fill="#cbd5e1">}</text>
