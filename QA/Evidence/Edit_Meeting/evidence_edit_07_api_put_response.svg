      <text x="32" y="101" font-family="monospace" font-size="12" fill="#38bdf8">&quot;startTime&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#a3e635">&quot;2026-10-10 14:00:00&quot;</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="32" y="124" font-family="monospace" font-size="12" fill="#38bdf8">&quot;endTime&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#a3e635">&quot;2026-10-10 15:30:00&quot;</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="32" y="147" font-family="monospace" font-size="12" fill="#38bdf8">&quot;organizerId&quot;<tspan fill="#cbd5e1">: </tspan><tspan fill="#fbbf24">1</tspan><tspan fill="#cbd5e1">,</tspan></text>
