<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Chỉnh sửa cuộc họp - Đổi Phòng Họp (Phòng Tokyo &rarr; Phòng Silicon)
    </text>
    
  <g transform="translate(130, 65)" filter="url(#sh3)">
    <rect width="640" height="490" rx="12" ry="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect width="640" height="50" rx="12" ry="12" fill="#f8fafc"/>
    <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Chỉnh sửa cuộc họp (ID: #1)</text>

    <!-- Title -->
    <g transform="translate(24, 65)">
      <text x="0" y="14" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Tiêu đề cuộc họp</text>
      <rect y="22" width="592" height="40" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="47" font-family="sans-serif" font-size="13" fill="#0f172a">Họp Sprint Planning K16</text>
    </g>

    <!-- Time Section (Fixed) -->
    <g transform="translate(24, 140)">
      <rect width="592" height="85" rx="8" ry="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">⏰ Thời gian họp: 2026-10-10 từ 09:00 đến 10:30 (1 giờ 30 phút)</text>
      <text x="16" y="55" font-family="sans-serif" font-size="12" fill="#64748b">Khung giờ được giữ nguyên khi chuyển đổi phòng.</text>
    </g>

    <!-- Room Selection (Change Focus) -->
    <g transform="translate(24, 240)">
      <text x="0" y="14" font-family="sans-serif" font-size="13" font-weight="600" fill="#2563eb">Phòng họp (Đổi sang phòng mới) 🔄</text>
      <rect y="22" width="592" height="42" rx="6" ry="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="12" y="48" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">Phòng Silicon (Tầng 2) — Sức chứa: 12 người (Mới)</text>
      
      <!-- Room status confirmation -->
      <g transform="translate(0, 75)">
        <rect width="592" height="45" rx="6" ry="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <text x="16" y="27" font-family="sans-serif" font-size="12" font-weight="600" fill="#166534">
          ✓ Phòng Silicon đang Active và hoàn toàn trống trong khung 09:00 - 10:30.
        </text>
      </g>
    </g>

    <!-- DB Update Confirmation -->
    <g transform="translate(24, 380)">
      <rect width="592" height="45" rx="6" ry="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="27" font-family="sans-serif" font-size="12" fill="#334155">
        Bảng <tspan font-family="monospace" font-weight="bold">Bookings</tspan> cập nhật: <tspan font-weight="bold">RoomID = 2</tspan> (Phòng Silicon), giải phóng Phòng Tokyo cũ.
      </text>
    </g>

    <!-- Actions -->
    <g transform="translate(24, 440)">
      <rect x="470" width="122" height="38" rx="6" ry="6" fill="#2563eb"/>
      <text x="531" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff">Lưu thay đổi</text>
    </g>
  </g>
  <rect x="680" y="580" width="200" height="28" rx="4" ry="4" fill="#0284c7"/>
  <text x="780" y="598" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">EVIDENCE: TC_EDIT_ROOM_001</text>
</svg>