<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh_c2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Danh sách cuộc họp - Cập nhật trạng thái 'Đã hủy' &amp; Gạch ngang tiêu đề
    </text>
    

  <g transform="translate(40, 65)" filter="url(#sh_c2)">
    <rect width="820" height="510" rx="10" ry="10" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Tabs navigation -->
    <g transform="translate(24, 20)">
      <rect width="110" height="34" rx="6" ry="6" fill="#f1f5f9"/>
      <text x="55" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748b">Tất cả (18)</text>

      <rect x="120" width="120" height="34" rx="6" ry="6" fill="#f1f5f9"/>
      <text x="180" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748b">Sắp tới (4)</text>

      <!-- Active Cancelled Tab -->
      <rect x="250" width="130" height="34" rx="6" ry="6" fill="#fee2e2" stroke="#fca5a5"/>
      <circle cx="270" cy="17" r="4" fill="#ef4444"/>
      <text x="320" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Đã hủy (1)</text>

      <rect x="390" width="130" height="34" rx="6" ry="6" fill="#f1f5f9"/>
      <text x="455" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748b">Đã diễn ra (13)</text>
    </g>

    <!-- Table Header -->
    <g transform="translate(24, 75)">
      <rect width="772" height="38" rx="6" ry="6" fill="#0f172a"/>
      <text x="18" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">MÃ</text>
      <text x="70" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">TIÊU ĐỀ CUỘC HỌP</text>
      <text x="320" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">PHÒNG HỌP</text>
      <text x="480" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">THỜI GIAN</text>
      <text x="630" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">TRẠNG THÁI</text>
      <text x="730" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">TÁC VỤ</text>
    </g>

    <!-- Row 1: Cancelled Meeting -->
    <g transform="translate(24, 125)">
      <rect width="772" height="65" rx="6" ry="6" fill="#fef2f2" stroke="#fecaca"/>
      <text x="18" y="38" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b">#1</text>
      
      <!-- Strikethrough Title -->
      <text x="70" y="30" font-family="sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-decoration="line-through">Họp Sprint Review K16</text>
      <line x1="70" y1="26" x2="230" y2="26" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="70" y="48" font-family="sans-serif" font-size="11" fill="#ef4444">Lý do: Dời lịch do sếp đi công tác đột xuất</text>

      <text x="320" y="38" font-family="sans-serif" font-size="13" fill="#64748b">Phòng Tokyo (Tầng 4)</text>

      <text x="480" y="38" font-family="sans-serif" font-size="13" fill="#94a3b8" text-decoration="line-through">10/10 • 09:00 - 10:30</text>
      <line x1="480" y1="34" x2="600" y2="34" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Cancelled Badge -->
      <rect x="630" y="20" width="82" height="26" rx="13" ry="13" fill="#fee2e2" stroke="#fca5a5"/>
      <circle cx="642" cy="33" r="3" fill="#ef4444"/>
      <text x="672" y="37" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Đã hủy</text>

      <!-- Action: Only View detail allowed, Edit/Cancel removed -->
      <circle cx="745" cy="33" r="14" fill="#ffffff" stroke="#cbd5e1"/>
      <path d="M740 33a5 5 0 0 0 10 0 5 5 0 0 0-10 0m5-2a2 2 0 1 1 0 4 2 2 0 0 1 0-4" stroke="#475569" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Row 2: Normal Scheduled Meeting -->
    <g transform="translate(24, 200)">
      <rect width="772" height="55" rx="6" ry="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="18" y="33" font-family="sans-serif" font-size="12" font-weight="700" fill="#3b82f6">#2</text>
      <text x="70" y="33" font-family="sans-serif" font-size="14" font-weight="600" fill="#0f172a">Họp Kế hoạch Marketing Q4</text>
      <text x="320" y="33" font-family="sans-serif" font-size="13" fill="#334155">Phòng Silicon (Tầng 2)</text>
      <text x="480" y="33" font-family="sans-serif" font-size="13" font-weight="600" fill="#1e293b">10/10 • 14:00 - 15:30</text>

      <rect x="630" y="20" width="90" height="26" rx="13" ry="13" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="642" cy="33" r="3" fill="#2563eb"/>
      <text x="677" y="37" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Sắp diễn ra</text>

      <circle cx="735" cy="33" r="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="762" cy="33" r="12" fill="#fee2e2" stroke="#fca5a5"/>
    </g>
  </g>
</svg>