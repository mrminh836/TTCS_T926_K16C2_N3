<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh_c3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Bộ lọc phòng trống Real-time - Xác nhận Phòng Tokyo được giải phóng 'Sẵn sàng'
    </text>
    

  <g transform="translate(40, 65)" filter="url(#sh_c3)">
    <rect width="820" height="510" rx="12" ry="12" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Filter Bar Header -->
    <g transform="translate(24, 20)">
      <rect width="772" height="64" rx="8" ry="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">BỘ LỌC TÌM PHÒNG TRỐNG NHANH:</text>

      <!-- Date selector -->
      <rect x="20" y="32" width="160" height="26" rx="4" ry="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="28" y="49" font-family="sans-serif" font-size="12" fill="#1e293b">📅 10/10/2026</text>

      <!-- Time selector: Exactly the cancelled meeting slot -->
      <rect x="190" y="32" width="130" height="26" rx="4" ry="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="198" y="49" font-family="sans-serif" font-size="12" font-weight="600" fill="#0284c7">⏰ 09:00 - 10:30</text>

      <!-- Quick status indicator -->
      <rect x="330" y="32" width="220" height="26" rx="4" ry="4" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="340" y="49" font-family="sans-serif" font-size="12" font-weight="700" fill="#047857">✓ Khung giờ vừa được giải phóng!</text>
    </g>

    <!-- Side-by-side comparison cards -->
    <text x="24" y="115" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">KẾT QUẢ ĐỐI CHIẾU TRƯỚC VÀ SAU KHI HỦY CUỘC HỌP ID=1:</text>

    <!-- Card 1: Before cancel (Busy) -->
    <g transform="translate(24, 135)">
      <rect width="370" height="320" rx="10" ry="10" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
      <rect width="370" height="38" rx="10" ry="10" fill="#fee2e2"/>
      <rect y="28" width="370" height="10" fill="#fee2e2"/>
      <text x="16" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#991b1b">TRƯỚC KHI HỦY (Cuộc họp còn hiệu lực)</text>

      <g transform="translate(18, 55)">
        <text x="0" y="20" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e293b">Phòng Tokyo (Tầng 4)</text>
        <text x="0" y="40" font-family="sans-serif" font-size="12" fill="#64748b">Mã: RM-001 • Sức chứa: 20 chỗ • Máy chiếu, Tivi</text>

        <!-- Red Busy Badge -->
        <g transform="translate(0, 60)">
          <rect width="334" height="60" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca"/>
          <circle cx="20" cy="30" r="8" fill="#ef4444"/>
          <text x="36" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#991b1b">Đang bận (09:00 - 10:30)</text>
          <text x="36" y="45" font-family="sans-serif" font-size="12" fill="#64748b">Cuộc họp: "Họp Sprint Review K16"</text>
        </g>

        <!-- Disabled Button -->
        <rect y="180" width="334" height="42" rx="6" ry="6" fill="#f1f5f9"/>
        <text x="167" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🚫 Phòng đang bận (Không thể đặt)</text>
      </g>
    </g>

    <!-- Card 2: After cancel (AVAILABLE IMMEDIATELY) -->
    <g transform="translate(426, 135)">
      <rect width="370" height="320" rx="10" ry="10" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
      <rect width="370" height="38" rx="10" ry="10" fill="#d1fae5"/>
      <rect y="28" width="370" height="10" fill="#d1fae5"/>
      <text x="16" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#065f46">NGAY SAU KHI HỦY (Đã giải phóng phòng)</text>

      <g transform="translate(18, 55)">
        <text x="0" y="20" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e293b">Phòng Tokyo (Tầng 4)</text>
        <text x="0" y="40" font-family="sans-serif" font-size="12" fill="#64748b">Mã: RM-001 • Sức chứa: 20 chỗ • Máy chiếu, Tivi</text>

        <!-- Green Ready Badge -->
        <g transform="translate(0, 60)">
          <rect width="334" height="60" rx="8" ry="8" fill="#ecfdf5" stroke="#a7f3d0"/>
          <circle cx="20" cy="30" r="8" fill="#10b981"/>
          <text x="36" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#065f46">Sẵn sàng (Phòng trống 100%)</text>
          <text x="36" y="45" font-family="sans-serif" font-size="12" fill="#047857">Phòng đã giải phóng khung 09:00 - 10:30</text>
        </g>

        <!-- Active Book Button -->
        <rect y="180" width="334" height="42" rx="6" ry="6" fill="#2563eb"/>
        <text x="167" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">⚡ Đặt lịch ngay tại phòng này →</text>
      </g>
    </g>
  </g>
</svg>