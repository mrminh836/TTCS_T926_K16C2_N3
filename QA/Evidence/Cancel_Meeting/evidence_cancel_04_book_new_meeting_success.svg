<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh_c4" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Đặt cuộc họp mới vào phòng vừa giải phóng - Thành công (Không bị 409 Conflict)
    </text>
    

  <g transform="translate(130, 65)" filter="url(#sh_c4)">
    <rect width="640" height="510" rx="12" ry="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect width="640" height="50" rx="12" ry="12" fill="#f8fafc"/>
    <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Đặt cuộc họp mới (Phòng vừa giải phóng)</text>

    <!-- Success message alert -->
    <g transform="translate(24, 65)">
      <rect width="592" height="48" rx="6" ry="6" fill="#f0fdf4" stroke="#86efac"/>
      <circle cx="24" cy="24" r="10" fill="#16a34a"/>
      <text x="24" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">✓</text>
      <text x="44" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803d">Phòng Tokyo đã sẵn sàng!</text>
      <text x="44" y="38" font-family="sans-serif" font-size="11" fill="#166534">Không phát sinh xung đột lịch (Cuộc họp cũ #1 đã bị hủy và nhường phòng thành công).</text>
    </g>

    <g transform="translate(24, 130)">
      <!-- Title field -->
      <text x="0" y="15" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155">Tiêu đề cuộc họp mới *</text>
      <rect y="24" width="592" height="38" rx="6" ry="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
      <text x="14" y="48" font-family="sans-serif" font-size="13" fill="#1e293b">Họp Khẩn Cấp Team Backend K16</text>

      <!-- Date & Time (Same slot as cancelled meeting) -->
      <g transform="translate(0, 80)">
        <text x="0" y="15" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155">Ngày họp *</text>
        <rect y="24" width="185" height="38" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="14" y="48" font-family="sans-serif" font-size="13" fill="#1e293b">2026-10-10</text>

        <text x="200" y="15" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155">Bắt đầu *</text>
        <rect x="200" y="24" width="185" height="38" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="214" y="48" font-family="sans-serif" font-size="13" fill="#1e293b">09:00</text>

        <text x="400" y="15" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155">Kết thúc *</text>
        <rect x="400" y="24" width="192" height="38" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="414" y="48" font-family="sans-serif" font-size="13" fill="#1e293b">10:30</text>
      </g>

      <!-- Room field -->
      <g transform="translate(0, 160)">
        <text x="0" y="15" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155">Phòng họp *</text>
        <rect y="24" width="592" height="38" rx="6" ry="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
        <text x="14" y="48" font-family="sans-serif" font-size="13" font-weight="600" fill="#1e293b">Phòng Tokyo (Tầng 4) — Trạng thái: Sẵn sàng</text>
      </g>

      <!-- Validation status box -->
      <g transform="translate(0, 240)">
        <rect width="592" height="50" rx="6" ry="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="20" cy="25" r="8" fill="#10b981"/>
        <text x="20" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">✓</text>
        <text x="36" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Hệ thống chấp nhận đặt phòng</text>
        <text x="36" y="38" font-family="sans-serif" font-size="11" fill="#64748b">checkMeetingRoomConflict() bỏ qua cuộc họp đã hủy -> HTTP 200 OK</text>
      </g>

      <!-- Submit button -->
      <g transform="translate(0, 310)">
        <rect width="592" height="44" rx="6" ry="6" fill="#16a34a"/>
        <text x="296" y="27" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Tạo cuộc họp thành công (Mã: #19)</text>
      </g>
    </g>
  </g>
</svg>