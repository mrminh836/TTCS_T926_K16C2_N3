<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh_c7" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#0f172a"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Kiểm thử API Backend: DELETE/PATCH /api/meetings/:id (Hủy họp &amp; Giải phóng phòng)
    </text>
    

  <g transform="translate(40, 65)" filter="url(#sh_c7)">
    <rect width="820" height="510" rx="10" ry="10" fill="#1e293b" stroke="#334155"/>

    <!-- URL Bar -->
    <g transform="translate(20, 20)">
      <rect width="80" height="38" rx="6" ry="6" fill="#ef4444"/>
      <text x="40" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff">DELETE</text>

      <rect x="90" width="600" height="38" rx="6" ry="6" fill="#0f172a" stroke="#334155"/>
      <text x="105" y="24" font-family="monospace" font-size="13" fill="#38bdf8">http://localhost:3000/api/meetings/1</text>

      <rect x="700" width="80" height="38" rx="6" ry="6" fill="#3b82f6"/>
      <text x="740" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Send</text>
    </g>

    <!-- Status Code Result -->
    <g transform="translate(20, 75)">
      <rect width="780" height="40" rx="6" ry="6" fill="#0f172a"/>
      <text x="16" y="25" font-family="monospace" font-size="12" fill="#94a3b8">Status:</text>
      <rect x="65" y="8" width="80" height="24" rx="4" ry="4" fill="#065f46"/>
      <text x="105" y="24" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">200 OK</text>

      <text x="170" y="25" font-family="monospace" font-size="12" fill="#94a3b8">Time:</text>
      <text x="210" y="25" font-family="monospace" font-size="12" fill="#38bdf8">38 ms</text>

      <text x="280" y="25" font-family="monospace" font-size="12" fill="#94a3b8">Action:</text>
      <text x="335" y="25" font-family="monospace" font-size="12" fill="#4ade80">BookingStatus -> 'Cancelled' (Room Released)</text>
    </g>

    <!-- Response JSON Body -->
    <g transform="translate(20, 130)">
      <rect width="780" height="340" rx="8" ry="8" fill="#020617" stroke="#1e293b"/>
      <text x="20" y="30" font-family="monospace" font-size="12" fill="#64748b">// Response Payload Body (JSON)</text>
      <text x="20" y="60" font-family="monospace" font-size="13" fill="#f8fafc">&#123;</text>
      <text x="40" y="85" font-family="monospace" font-size="13" fill="#38bdf8">"success"</text><text x="110" y="85" font-family="monospace" font-size="13" fill="#f8fafc">: </text><text x="125" y="85" font-family="monospace" font-size="13" fill="#4ade80">true</text><text x="160" y="85" font-family="monospace" font-size="13" fill="#f8fafc">,</text>
      
      <text x="40" y="110" font-family="monospace" font-size="13" fill="#38bdf8">"message"</text><text x="110" y="110" font-family="monospace" font-size="13" fill="#f8fafc">: </text><text x="125" y="110" font-family="monospace" font-size="13" fill="#fde047">"Hủy cuộc họp thành công. Phòng họp đã được giải phóng."</text><text x="590" y="110" font-family="monospace" font-size="13" fill="#f8fafc">,</text>
      
      <text x="40" y="135" font-family="monospace" font-size="13" fill="#38bdf8">"data"</text><text x="80" y="135" font-family="monospace" font-size="13" fill="#f8fafc">: &#123;</text>
      
      <text x="65" y="160" font-family="monospace" font-size="13" fill="#38bdf8">"meetingId"</text><text x="155" y="160" font-family="monospace" font-size="13" fill="#f8fafc">: </text><text x="175" y="160" font-family="monospace" font-size="13" fill="#f43f5e">1</text><text x="185" y="160" font-family="monospace" font-size="13" fill="#f8fafc">,</text>
      <text x="65" y="185" font-family="monospace" font-size="13" fill="#38bdf8">"title"</text><text x="120" y="185" font-family="monospace" font-size="13" fill="#f8fafc">: </text><text x="140" y="185" font-family="monospace" font-size="13" fill="#fde047">"Họp Sprint Review K16"</text><text x="345" y="185" font-family="monospace" font-size="13" fill="#f8fafc">,</text>
      <text x="65" y="210" font-family="monospace" font-size="13" fill="#38bdf8">"status"</text><text x="125" y="210" font-family="monospace" font-size="13" fill="#f8fafc">: </text><text x="145" y="210" font-family="monospace" font-size="13" fill="#fde047">"Cancelled"</text><text x="245" y="210" font-family="monospace" font-size="13" fill="#f8fafc">,</text>
      <text x="65" y="235" font-family="monospace" font-size="13" fill="#38bdf8">"releasedRoom"</text><text x="185" y="235" font-family="monospace" font-size="13" fill="#f8fafc">: &#123;</text>
      <text x="90" y="260" font-family="monospace" font-size="13" fill="#38bdf8">"roomId"</text><text x="155" y="260" font-family="monospace" font-size="13" fill="#f8fafc">: </text><text x="175" y="260" font-family="monospace" font-size="13" fill="#f43f5e">1</text><text x="185" y="260" font-family="monospace" font-size="13" fill="#f8fafc">,</text>
      <text x="90" y="285" font-family="monospace" font-size="13" fill="#38bdf8">"roomName"</text><text x="175" y="285" font-family="monospace" font-size="13" fill="#f8fafc">: </text><text x="195" y="285" font-family="monospace" font-size="13" fill="#fde047">"Phòng Tokyo (Tầng 4)"</text><text x="390" y="285" font-family="monospace" font-size="13" fill="#f8fafc">,</text>
      <text x="90" y="310" font-family="monospace" font-size="13" fill="#38bdf8">"isAvailableNow"</text><text x="220" y="310" font-family="monospace" font-size="13" fill="#f8fafc">: </text><text x="240" y="310" font-family="monospace" font-size="13" fill="#4ade80">true</text>
      <text x="65" y="330" font-family="monospace" font-size="13" fill="#f8fafc">&#125;</text>
      <text x="40" y="350" font-family="monospace" font-size="13" fill="#f8fafc">&#125;</text>
      <text x="20" y="370" font-family="monospace" font-size="13" fill="#f8fafc">&#125;</text>
    </g>
  </g>
</svg>