<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh_c1" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f1f5f9"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Hủy cuộc họp - Popup xác nhận &amp; Nhập lý do giải phóng phòng
    </text>
    

  <!-- Overlay background -->
  <rect x="0" y="42" width="900" height="578" fill="#0f172a" fill-opacity="0.5"/>

  <!-- Modal Box -->
  <g transform="translate(180, 80)" filter="url(#sh_c1)">
    <rect width="540" height="470" rx="14" ry="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Modal Header with Warning Icon -->
    <g transform="translate(30, 28)">
      <circle cx="24" cy="24" r="24" fill="#fee2e2"/>
      <path d="M24 14v12M24 30h.01" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="22" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a">Xác nhận hủy cuộc họp</text>
      <text x="64" y="42" font-family="sans-serif" font-size="13" fill="#64748b">Phòng họp sẽ được giải phóng ngay sau khi hủy</text>
    </g>

    <line x1="30" y1="95" x2="510" y2="95" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Meeting info card -->
    <g transform="translate(30, 115)">
      <rect width="480" height="110" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="20" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b">CUỘC HỌP SẮP HỦY:</text>
      <text x="20" y="52" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Họp Sprint Review K16 (Mã: #1)</text>
      
      <circle cx="28" cy="80" r="5" fill="#3b82f6"/>
      <text x="40" y="84" font-family="sans-serif" font-size="13" fill="#334155">Phòng Tokyo (Tầng 4) • Sức chứa 20 người</text>

      <text x="320" y="84" font-family="sans-serif" font-size="13" font-weight="600" fill="#e11d48">09:00 - 10:30 (10/10/2026)</text>
    </g>

    <!-- Room Release Notice -->
    <g transform="translate(30, 238)">
      <rect width="480" height="42" rx="6" ry="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="24" cy="21" r="10" fill="#3b82f6"/>
      <text x="24" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">i</text>
      <text x="44" y="25" font-family="sans-serif" font-size="12" font-weight="500" fill="#1e40af">
        Phòng Tokyo sẽ trở về trạng thái <tspan font-weight="700" fill="#047857">"Sẵn sàng"</tspan> cho các nhóm khác đặt ngay.
      </text>
    </g>

    <!-- Reason input field -->
    <g transform="translate(30, 295)">
      <text x="0" y="15" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155">Lý do hủy cuộc họp (tùy chọn):</text>
      <text x="480" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#94a3b8">41/500 ký tự</text>
      <rect y="24" width="480" height="65" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="14" y="50" font-family="sans-serif" font-size="13" fill="#1e293b">Dời lịch họp do sếp đi công tác đột xuất</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(30, 400)">
      <rect width="210" height="42" rx="6" ry="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="105" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Giữ lại cuộc họp (Đóng)</text>

      <rect x="230" width="250" height="42" rx="6" ry="6" fill="#ef4444"/>
      <text x="355" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Xác nhận hủy &amp; Giải phóng phòng</text>
    </g>
  </g>
</svg>