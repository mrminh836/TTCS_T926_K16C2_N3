<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh_a4" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <rect width="900" height="42" fill="#0f172a" rx="10" ry="10"/>
    <rect y="32" width="900" height="10" fill="#0f172a"/>
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>
    <text x="450" y="26" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Bảo Mật Xác Thực • Chặn Đăng Nhập Sai Mật Khẩu (HTTP 401 Unauthorized)</text>
    

  <g transform="translate(180, 70)" filter="url(#sh_a4)">
    <rect width="540" height="500" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0"/>

    <rect width="540" height="75" rx="16" ry="16" fill="#0f172a"/>
    <rect y="60" width="540" height="15" fill="#0f172a"/>
    <text x="30" y="36" font-family="sans-serif" font-size="19" font-weight="800" fill="#ffffff">Đăng Nhập - Kiểm Soát Sai Thông Tin</text>
    <text x="30" y="58" font-family="sans-serif" font-size="12" fill="#94a3b8">Bảo vệ chống tấn công Brute-force &amp; Dò quét tài khoản</text>

    <!-- Error Banner 401 -->
    <g transform="translate(30, 95)">
      <rect width="480" height="65" rx="8" ry="8" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="28" cy="32" r="14" fill="#ef4444"/>
      <text x="28" y="37" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">✕</text>
      <text x="54" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#991b1b">HTTP 401 Unauthorized</text>
      <text x="54" y="48" font-family="sans-serif" font-size="12" fill="#b91c1c">"Tên đăng nhập hoặc mật khẩu không chính xác."</text>
    </g>

    <!-- Form Inputs with Red border on Password -->
    <g transform="translate(30, 180)">
      <text x="0" y="15" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Tên đăng nhập / Email</text>
      <rect y="24" width="480" height="40" rx="6" ry="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="14" y="49" font-family="sans-serif" font-size="13.5" fill="#0f172a">khuyen.hv@enterprise.vn</text>

      <g transform="translate(0, 80)">
        <text x="0" y="15" font-family="sans-serif" font-size="12" font-weight="700" fill="#dc2626">Mật khẩu nhập sai ⚠️</text>
        <rect y="24" width="480" height="40" rx="6" ry="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
        <text x="14" y="49" font-family="sans-serif" font-size="15" fill="#be123c">•••••••• (Sai mật khẩu)</text>
      </g>

      <!-- Security Best Practice Note -->
      <g transform="translate(0, 165)">
        <rect width="480" height="70" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="14" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">🛡️ Cơ chế bảo mật chuẩn OWASP:</text>
        <text x="14" y="44" font-family="sans-serif" font-size="11" fill="#64748b">• bcrypt.compare(pass, hash) trả về false $ightarrow$ Hủy giao dịch ngay lập tức.</text>
        <text x="14" y="60" font-family="sans-serif" font-size="11" fill="#64748b">• Thông báo lỗi chung, không tiết lộ tài khoản có tồn tại hay không.</text>
      </g>
    </g>

    <!-- Retry Action -->
    <g transform="translate(30, 440)">
      <rect width="480" height="42" rx="8" ry="8" fill="#dc2626"/>
      <text x="240" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Đăng nhập lại</text>
    </g>
  </g>
</svg>