<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="100%" height="100%">
  <defs>
    <linearGradient id="guard_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="860" height="540" rx="14" ry="14" fill="url(#guard_bg)"/>
  <rect x="0" y="0" width="860" height="46" rx="14" ry="14" fill="#1e293b"/>
  <circle cx="24" cy="23" r="6" fill="#ef4444"/>
  <circle cx="44" cy="23" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="23" r="6" fill="#10b981"/>
  <text x="430" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Kiểm thử Auth Route Guard — Chặn Truy Cập Trái Phép Route Quản Trị /admin</text>

  <g transform="translate(40, 75)">
    <!-- Browser Address Bar Simulation -->
    <rect width="780" height="44" rx="8" ry="8" fill="#334155" stroke="#475569"/>
    <text x="20" y="27" font-family="monospace" font-size="13" fill="#cbd5e1">https://enterprise-meeting.vn/index.html#/admin</text>
    <rect x="660" y="8" width="105" height="28" rx="4" ry="4" fill="#dc2626"/>
    <text x="712" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">ACCESS DENIED</text>

    <!-- Execution Steps Flow -->
    <g transform="translate(0, 70)">
      <!-- Step 1 -->
      <rect width="240" height="150" rx="8" ry="8" fill="#1e293b" stroke="#3b82f6"/>
      <circle cx="30" cy="30" r="14" fill="#3b82f6"/>
      <text x="30" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
      <text x="55" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#93c5fd">Người dùng nhập URL</text>
      <text x="15" y="70" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">User có Role="Employee"</text>
      <text x="15" y="92" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">cố tình gõ trực tiếp route</text>
      <text x="15" y="114" font-family="monospace" font-size="12" fill="#38bdf8">#/admin</text>
      <text x="15" y="136" font-family="sans-serif" font-size="11" fill="#64748b">trên thanh địa chỉ duyệt web</text>

      <!-- Arrow 1 -->
      <text x="252" y="150" font-size="20" fill="#94a3b8">→</text>

      <!-- Step 2 -->
      <g transform="translate(270, 0)">
        <rect width="240" height="150" rx="8" ry="8" fill="#1e293b" stroke="#f59e0b"/>
        <circle cx="30" cy="30" r="14" fill="#f59e0b"/>
        <text x="30" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
        <text x="55" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#fcd34d">Router Guard Kiểm Tra</text>
        <text x="15" y="70" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">router.js kích hoạt:</text>
        <text x="15" y="92" font-family="monospace" font-size="11" fill="#fde68a">route.options.requireAdmin</text>
        <text x="15" y="114" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">AuthState.isAdmin() = false</text>
        <text x="15" y="136" font-family="sans-serif" font-size="11" fill="#10b981">✓ Phát hiện truy cập trái phép</text>
      </g>

      <!-- Arrow 2 -->
      <text x="522" y="150" font-size="20" fill="#94a3b8">→</text>

      <!-- Step 3 -->
      <g transform="translate(540, 0)">
        <rect width="240" height="150" rx="8" ry="8" fill="#1e293b" stroke="#10b981"/>
        <circle cx="30" cy="30" r="14" fill="#10b981"/>
        <text x="30" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
        <text x="55" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">Bảo Vệ &amp; Chuyển Hướng</text>
        <text x="15" y="70" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">Bắn Toast Cảnh Báo Đỏ:</text>
        <text x="15" y="92" font-family="sans-serif" font-size="11" fill="#fca5a5">"Bạn không có quyền Admin..."</text>
        <text x="15" y="114" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">Tự động Redirect về:</text>
        <text x="15" y="136" font-family="monospace" font-size="12" fill="#34d399">index.html#/meetings</text>
      </g>
    </g>

    <!-- Simulated Toast Notification Banner -->
    <g transform="translate(140, 255)">
      <rect width="500" height="60" rx="8" ry="8" fill="#7f1d1d" stroke="#ef4444" filter="drop-shadow(0 6px 10px rgba(0,0,0,0.4))"/>
      <circle cx="35" cy="30" r="16" fill="#dc2626"/>
      <text x="35" y="37" text-anchor="middle" font-size="16" fill="#ffffff">⚠️</text>
      <text x="65" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">LỖI PHÂN QUYỀN (ACCESS CONTROL ERROR)</text>
      <text x="65" y="46" font-family="sans-serif" font-size="11.5" fill="#fecaca">Bạn không có quyền Quản trị (Admin) để truy cập trang này. Đang chuyển hướng...</text>
    </g>

    <text x="390" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#10b981">KẾT LUẬN KIỂM THỬ: AUTH ROUTER GUARD PHÍA FRONTEND ĐẠT CHUẨN AN TOÀN 100%</text>
  </g>
</svg>