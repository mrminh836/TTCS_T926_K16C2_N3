<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="100%" height="100%">
  <defs>
    <linearGradient id="att_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="860" height="540" rx="14" ry="14" fill="url(#att_bg)"/>
  <rect x="0" y="0" width="860" height="46" rx="14" ry="14" fill="#1e293b"/>
  <circle cx="24" cy="23" r="6" fill="#ef4444"/>
  <circle cx="44" cy="23" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="23" r="6" fill="#10b981"/>
  <text x="430" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Cổng Người Tham Dự (Attendee / Employee Portal) — Chế độ Chỉ Đọc &amp; Phản hồi lời mời</text>

  <g transform="translate(30, 70)">
    <!-- Header Card -->
    <rect width="800" height="74" rx="10" ry="10" fill="#334155" filter="url(#shadow3)"/>
    <circle cx="42" cy="37" r="22" fill="#64748b"/>
    <text x="42" y="44" text-anchor="middle" font-size="20" fill="#ffffff">👤</text>
    <text x="80" y="30" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Phạm Hoàng Nhân Viên (employee)</text>
    <text x="80" y="52" font-family="sans-serif" font-size="12" fill="#94a3b8">employee@enterprise.vn • UserID: 4</text>

    <!-- Role Badges -->
    <rect x="490" y="22" width="145" height="30" rx="15" ry="15" fill="#475569"/>
    <text x="562" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">ROLE: EMPLOYEE</text>
    <rect x="650" y="22" width="130" height="30" rx="15" ry="15" fill="#d97706"/>
    <text x="715" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">LIMITED ACCESS</text>

    <!-- UI Representation -->
    <g transform="translate(0, 95)">
      <rect width="800" height="150" rx="8" ry="8" fill="#1e293b" stroke="#475569"/>
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">BẢNG PHÂN QUYỀN GIAO DIỆN PHÍA CLIENT (CLIENT UI VISIBILITY)</text>

      <g transform="translate(20, 50)">
        <rect width="180" height="80" rx="6" ry="6" fill="#0f172a" stroke="#10b981"/>
        <text x="90" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">Lịch Cá Nhân</text>
        <text x="90" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">HIỂN THỊ (VIEW)</text>
        <text x="90" y="68" text-anchor="middle" font-size="12" fill="#10b981">✓ Khả dụng</text>
      </g>

      <g transform="translate(215, 50)">
        <rect width="180" height="80" rx="6" ry="6" fill="#0f172a" stroke="#10b981"/>
        <text x="90" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">Phản Hồi Lời Mời</text>
        <text x="90" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">ACCEPT / DECLINE</text>
        <text x="90" y="68" text-anchor="middle" font-size="12" fill="#10b981">✓ Khả dụng</text>
      </g>

      <g transform="translate(410, 50)">
        <rect width="180" height="80" rx="6" ry="6" fill="#0f172a" stroke="#ef4444"/>
        <text x="90" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f87171">Nút Quản Trị Admin</text>
        <text x="90" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">ADMIN PANEL</text>
        <text x="90" y="68" text-anchor="middle" font-size="12" fill="#ef4444">✗ ẨN HOÀN TOÀN</text>
      </g>

      <g transform="translate(605, 50)">
        <rect width="175" height="80" rx="6" ry="6" fill="#0f172a" stroke="#f59e0b"/>
        <text x="87" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Đặt Phòng VIP</text>
        <text x="87" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">POLICY CHECK</text>
        <text x="87" y="68" text-anchor="middle" font-size="12" fill="#f59e0b">🔒 Yêu cầu phê duyệt</text>
      </g>
    </g>

    <!-- Test Audit Callout -->
    <g transform="translate(0, 265)">
      <rect width="800" height="85" rx="8" ry="8" fill="#1e293b" stroke="#64748b"/>
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">KIỂM THỬ KHẢ NĂNG TRUY CẬP (ATTENDEE ACCESS AUDIT)</text>
      <text x="20" y="52" font-family="monospace" font-size="12" fill="#94a3b8">GET /api/meetings/my-invitations • Trả về 4 lời mời họp • Quyền phản hồi: Cấp phép</text>
      <text x="20" y="72" font-family="sans-serif" font-size="11" fill="#38bdf8">Tài khoản Employee tuân thủ phân quyền RBAC • Không thể chỉnh sửa dữ liệu người khác</text>
      <rect x="670" y="24" width="110" height="36" rx="6" ry="6" fill="#10b981"/>
      <text x="725" y="46" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">PASSED ✓</text>
    </g>
  </g>
</svg>