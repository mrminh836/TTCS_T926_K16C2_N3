<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh_c6" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Toast Thông Báo Giải Phóng Phòng &amp; Real-time Counter trên Tabs
    </text>
    

  <!-- Dashboard Overview Background -->
  <g transform="translate(40, 70)">
    <text x="0" y="24" font-family="sans-serif" font-size="20" font-weight="800" fill="#0f172a">Quản Lý Lịch Họp &amp; Đặt Phòng Doanh Nghiệp</text>
    
    <!-- KPI Counters with updated values -->
    <g transform="translate(0, 45)">
      <rect width="185" height="90" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b">TỔNG CUỘC HỌP</text>
      <text x="16" y="65" font-family="sans-serif" font-size="28" font-weight="800" fill="#0f172a">18</text>

      <rect x="200" width="185" height="90" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="216" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#2563eb">SẮP TỚI (GIẢM -1)</text>
      <text x="216" y="65" font-family="sans-serif" font-size="28" font-weight="800" fill="#2563eb">4</text>
      <text x="250" y="65" font-family="sans-serif" font-size="13" font-weight="600" fill="#ef4444">↓ -1</text>

      <rect x="400" width="185" height="90" rx="8" ry="8" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="416" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#b91c1c">ĐÃ HỦY (TĂNG +1)</text>
      <text x="416" y="65" font-family="sans-serif" font-size="28" font-weight="800" fill="#ef4444">1</text>
      <text x="450" y="65" font-family="sans-serif" font-size="13" font-weight="700" fill="#16a34a">↑ +1</text>

      <rect x="600" width="220" height="90" rx="8" ry="8" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="616" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#065f46">PHÒNG KHẢ DỤNG</text>
      <text x="616" y="65" font-family="sans-serif" font-size="28" font-weight="800" fill="#059669">4 / 5</text>
      <text x="700" y="65" font-family="sans-serif" font-size="12" font-weight="600" fill="#047857">Phòng Tokyo sẵn sàng</text>
    </g>

    <!-- Table preview -->
    <rect y="160" width="820" height="280" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="195" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748b">Bảng danh sách cuộc họp đã được cập nhật real-time không cần tải lại trang</text>
  </g>

  <!-- Floating Toast Notification on Top Right -->
  <g transform="translate(480, 75)" filter="url(#sh_c6)">
    <rect width="380" height="95" rx="10" ry="10" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect width="6" height="95" rx="3" ry="3" fill="#16a34a"/>

    <circle cx="34" cy="32" r="14" fill="#dcfce7"/>
    <path d="M28 32l4 4 8-8" stroke="#16a34a" stroke-width="2" fill="none"/>

    <text x="58" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#15803d">Hủy cuộc họp thành công!</text>
    <text x="58" y="48" font-family="sans-serif" font-size="12" fill="#334155">
      Phòng Tokyo đã được <tspan font-weight="700" fill="#059669">giải phóng</tspan> khung giờ
    </text>
    <text x="58" y="65" font-family="sans-serif" font-size="12" font-weight="600" fill="#0284c7">09:00 - 10:30 ngày 10/10/2026.</text>

    <!-- Toast Action Button -->
    <text x="290" y="80" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-decoration="underline">Xem tab Đã hủy →</text>
  </g>
</svg>