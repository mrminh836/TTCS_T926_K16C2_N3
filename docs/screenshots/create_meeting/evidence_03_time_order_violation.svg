<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="580" rx="10" ry="10" fill="#f8fafc"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Validation: Giờ Kết Thúc Sớm Hơn Bắt Đầu (start > end)
    </text>
    

  <!-- Modal Container -->
  <g transform="translate(130, 65)" filter="url(#shadow3)">
    <rect width="640" height="460" rx="12" ry="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Modal Header -->
    <rect width="640" height="50" rx="12" ry="12" fill="#f8fafc"/>
    <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Thêm cuộc họp</text>

    <!-- Title Field (Valid) -->
    <g transform="translate(24, 70)">
      <text x="0" y="14" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Tiêu đề cuộc họp <tspan fill="#ef4444">*</tspan></text>
      <rect y="22" width="592" height="40" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="47" font-family="sans-serif" font-size="13" font-weight="500" fill="#0f172a">Họp đánh giá kỹ thuật dự án</text>
    </g>

    <!-- Time Section (Violation Focus) -->
    <g transform="translate(24, 155)">
      <rect width="592" height="215" rx="8" ry="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Time Header with Invalid Duration Badge -->
      <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">⏰ Thời gian <tspan fill="#ef4444">*</tspan></text>
      
      <!-- Duration Badge (Negative duration) -->
      <rect x="420" y="10" width="155" height="26" rx="13" ry="13" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="497" y="27" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#dc2626">⚠ Thời lượng: Không hợp lệ</text>

      <!-- 3 Inputs -->
      <g transform="translate(16, 45)">
        <text x="0" y="12" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569">Ngày họp</text>
        <rect y="18" width="170" height="40" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="43" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">2026-09-28</text>
      </g>

      <g transform="translate(210, 45)">
        <text x="0" y="12" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569">Thời gian bắt đầu</text>
        <rect y="18" width="170" height="40" rx="6" ry="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="12" y="43" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">15:00</text>
      </g>

      <!-- End Time (Violating - Red border) -->
      <g transform="translate(405, 45)">
        <text x="0" y="12" font-family="sans-serif" font-size="11" font-weight="600" fill="#ef4444">Thời gian kết thúc ⚠</text>
        <rect y="18" width="170" height="40" rx="6" ry="6" fill="#fff" stroke="#ef4444" stroke-width="2"/>
        <text x="12" y="43" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">14:00</text>
      </g>

      <!-- Time Error Message Box -->
      <g transform="translate(16, 120)">
        <rect width="560" height="65" rx="8" ry="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
        <circle cx="28" cy="32" r="12" fill="#ef4444"/>
        <text x="28" y="37" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">!</text>
        <text x="50" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#991b1b">
          Lỗi trình tự thời gian cuộc họp!
        </text>
        <text x="50" y="48" font-family="sans-serif" font-size="12" fill="#b91c1c">
          Thời gian kết thúc (14:00) phải lớn hơn thời gian bắt đầu (15:00). Vui lòng kiểm tra lại.
        </text>
      </g>
    </g>

    <!-- Save Button Disabled Indicator -->
    <g transform="translate(24, 395)">
      <rect x="470" width="122" height="40" rx="6" ry="6" fill="#94a3b8"/>
      <text x="531" y="25" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff">Lưu cuộc họp</text>
      <text x="200" y="25" font-family="sans-serif" font-size="12" fill="#dc2626">Form bị khóa submit do dữ liệu thời gian sai quy chuẩn</text>
    </g>
  </g>

  <!-- Evidence Tag -->
  <rect x="700" y="540" width="180" height="28" rx="4" ry="4" fill="#ef4444"/>
  <text x="790" y="558" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">EVIDENCE: TC_MEET_TIME_006</text>
</svg>