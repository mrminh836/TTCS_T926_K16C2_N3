<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="700" rx="10" ry="10" fill="#f8fafc"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Validation: Chặn Bỏ Trống Trường Bắt Buộc (Mandatory Fields Error)
    </text>
    

  <!-- Modal Container -->
  <g transform="translate(130, 55)" filter="url(#shadow2)">
    <rect width="640" height="610" rx="12" ry="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Modal Header -->
    <rect width="640" height="50" rx="12" ry="12" fill="#f8fafc"/>
    <rect y="40" width="640" height="10" fill="#f8fafc"/>
    <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Thêm cuộc họp</text>

    <!-- Global Error Box -->
    <g transform="translate(24, 65)">
      <rect width="592" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
      <circle cx="28" cy="25" r="12" fill="#ef4444"/>
      <text x="28" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">!</text>
      <text x="50" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Thông tin chưa hợp lệ</text>
      <text x="50" y="38" font-family="sans-serif" font-size="12" fill="#dc2626">Vui lòng kiểm tra lại các trường được đánh dấu đỏ trước khi tiếp tục.</text>
    </g>

    <!-- Field 1: Title (Invalid) -->
    <g transform="translate(24, 130)">
      <text x="0" y="14" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Tiêu đề cuộc họp <tspan fill="#ef4444">*</tspan></text>
      <rect y="22" width="592" height="42" rx="6" ry="6" fill="#fff" stroke="#ef4444" stroke-width="2"/>
      <!-- Exclamation icon inside input -->
      <circle cx="570" cy="43" r="8" fill="#ef4444"/>
      <text x="570" y="47" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">!</text>
      <text x="12" y="47" font-family="sans-serif" font-size="13" fill="#94a3b8">Ví dụ: Họp Sprint Review nhóm K16C2</text>
      <!-- Error text -->
      <text x="0" y="80" font-family="sans-serif" font-size="12" font-weight="600" fill="#ef4444">⚠ Tiêu đề cuộc họp là bắt buộc và không được để trống.</text>
    </g>

    <!-- Field 2: Time Section Box (Invalid) -->
    <g transform="translate(24, 230)">
      <rect width="592" height="155" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">⏰ Thời gian <tspan fill="#ef4444">*</tspan></text>

      <!-- 3 Inputs: Date, Start, End -->
      <!-- Date Input (Invalid) -->
      <g transform="translate(16, 36)">
        <text x="0" y="12" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569">Ngày họp</text>
        <rect y="18" width="170" height="38" rx="6" ry="6" fill="#fff" stroke="#ef4444" stroke-width="2"/>
        <text x="10" y="42" font-family="sans-serif" font-size="12" fill="#94a3b8">yyyy-mm-dd</text>
      </g>

      <!-- Start Input (Invalid) -->
      <g transform="translate(210, 36)">
        <text x="0" y="12" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569">Thời gian bắt đầu</text>
        <rect y="18" width="170" height="38" rx="6" ry="6" fill="#fff" stroke="#ef4444" stroke-width="2"/>
        <text x="10" y="42" font-family="sans-serif" font-size="12" fill="#94a3b8">--:--</text>
      </g>

      <!-- End Input (Invalid) -->
      <g transform="translate(405, 36)">
        <text x="0" y="12" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569">Thời gian kết thúc</text>
        <rect y="18" width="170" height="38" rx="6" ry="6" fill="#fff" stroke="#ef4444" stroke-width="2"/>
        <text x="10" y="42" font-family="sans-serif" font-size="12" fill="#94a3b8">--:--</text>
      </g>

      <!-- Time Error Alert Inside Box -->
      <g transform="translate(16, 105)">
        <rect width="560" height="36" rx="6" ry="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#b91c1c">
          ⚠ Vui lòng chọn ngày họp, thời gian bắt đầu và kết thúc đầy đủ.
        </text>
      </g>
    </g>

    <!-- Field 3: Room Selection -->
    <g transform="translate(24, 405)">
      <text x="0" y="14" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Phòng họp <tspan fill="#ef4444">*</tspan></text>
      <rect y="22" width="592" height="40" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="47" font-family="sans-serif" font-size="13" fill="#0f172a">Phòng Tokyo (Tầng 4) — Sức chứa: 20 người</text>
    </g>

    <!-- Modal Actions -->
    <g transform="translate(24, 530)">
      <rect x="470" width="122" height="42" rx="6" ry="6" fill="#2563eb"/>
      <text x="531" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#fff">💾 Lưu cuộc họp</text>
      
      <rect x="375" width="85" height="42" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="417" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#475569">Hủy</text>
    </g>
  </g>

  <!-- Evidence Tag -->
  <rect x="700" y="660" width="180" height="28" rx="4" ry="4" fill="#ef4444"/>
  <text x="790" y="678" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">EVIDENCE: TC_MEET_REQ_003</text>
</svg>