<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="sh5" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="620" rx="10" ry="10" fill="#f8fafc"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Validation: Đổi Giờ Bị Trùng Lặp Với Cuộc Họp Khác (HTTP 409 Conflict)
    </text>
    
  <g transform="translate(130, 60)" filter="url(#sh5)">
    <rect width="640" height="500" rx="12" ry="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect width="640" height="50" rx="12" ry="12" fill="#f8fafc"/>
    <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Chỉnh sửa cuộc họp ID: #1</text>

    <!-- Current Meeting Info -->
    <g transform="translate(24, 65)">
      <text x="0" y="14" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Đang sửa: &quot;Họp Sprint Review&quot; (Phòng Tokyo)</text>
    </g>

    <!-- Conflict Time Input -->
    <g transform="translate(24, 95)">
      <rect width="592" height="115" rx="8" ry="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
      <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#9f1239">⏰ Đổi giờ sang khung: 10:00 - 11:30 (Trùng với Cuộc họp #2)</text>
      
      <rect x="16" y="38" width="170" height="36" rx="6" ry="6" fill="#fff" stroke="#f43f5e" stroke-width="2"/>
      <text x="28" y="61" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e11d48">2026-10-10</text>

      <rect x="200" y="38" width="170" height="36" rx="6" ry="6" fill="#fff" stroke="#f43f5e" stroke-width="2"/>
      <text x="212" y="61" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e11d48">10:00</text>

      <rect x="384" y="38" width="170" height="36" rx="6" ry="6" fill="#fff" stroke="#f43f5e" stroke-width="2"/>
      <text x="396" y="61" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e11d48">11:30</text>

      <text x="16" y="98" font-family="sans-serif" font-size="11" fill="#be123c">⚠ Trong phòng Tokyo đã có sẵn cuộc họp &quot;Demo sản phẩm K16&quot; (10:15 - 11:15).</text>
    </g>

    <!-- Conflict Alert Banner -->
    <g transform="translate(24, 230)">
      <rect width="592" height="85" rx="8" ry="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="30" cy="42" r="14" fill="#dc2626"/>
      <text x="30" y="47" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">✕</text>
      <text x="56" y="34" font-family="sans-serif" font-size="14" font-weight="700" fill="#991b1b">
        Cập nhật thất bại! Xung đột lịch phòng họp (Mã 409)
      </text>
      <text x="56" y="56" font-family="sans-serif" font-size="12" fill="#b91c1c">
        Phòng này đã có cuộc họp khác trong khung giờ bạn chọn.
      </text>
      <text x="56" y="74" font-family="sans-serif" font-size="11" fill="#7f1d1d">
        API Response: HTTP 409 Conflict: &quot;Cập nhật thất bại! Phòng này đã có cuộc họp khác...&quot;
      </text>
    </g>

    <!-- Retention of Form Data -->
    <g transform="translate(24, 335)">
      <rect width="592" height="55" rx="6" ry="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">
        Trải nghiệm người dùng (UX):
      </text>
      <text x="16" y="42" font-family="sans-serif" font-size="12" fill="#475569">
        Form không bị đóng, giữ nguyên dữ liệu vừa nhập để người dùng kịp thời đổi sang giờ hoặc phòng khác.
      </text>
    </g>

    <!-- Actions -->
    <g transform="translate(24, 435)">
      <rect x="470" width="122" height="40" rx="6" ry="6" fill="#94a3b8"/>
      <text x="531" y="25" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff">Lưu thay đổi</text>
    </g>
  </g>
  <rect x="680" y="580" width="200" height="28" rx="4" ry="4" fill="#dc2626"/>
  <text x="780" y="598" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">EVIDENCE: TC_EDIT_OVL_002</text>
</svg>