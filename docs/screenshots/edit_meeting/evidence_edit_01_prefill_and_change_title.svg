<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <defs>
    <filter id="sh1" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="640" rx="10" ry="10" fill="#f8fafc"/>
  
    <!-- Window Bar -->
    <rect width="900" height="42" rx="10" ry="10" fill="#1e293b"/>
    <rect y="32" width="900" height="10" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="#ef4444"/>
    <circle cx="38" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="6" fill="#10b981"/>
    <text x="450.0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      Chỉnh sửa cuộc họp - Prefill dữ liệu cũ &amp; Đổi tiêu đề
    </text>
    
  <g transform="translate(130, 65)" filter="url(#sh1)">
    <rect width="640" height="520" rx="12" ry="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect width="640" height="50" rx="12" ry="12" fill="#f8fafc"/>
    <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Chỉnh sửa cuộc họp (ID: #1)</text>
    <circle cx="610" cy="25" r="14" fill="#f1f5f9"/>
    <text x="610" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">×</text>

    <!-- Success Toast Notification -->
    <g transform="translate(24, 60)">
      <rect width="592" height="42" rx="6" ry="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#15803d">✓ Đã tải dữ liệu cuộc họp cũ thành công (Prefill 100%)</text>
    </g>

    <!-- Field 1: Title (Edited) -->
    <g transform="translate(24, 115)">
      <text x="0" y="14" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Tiêu đề cuộc họp <tspan fill="#ef4444">*</tspan></text>
      <rect y="22" width="592" height="40" rx="6" ry="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="12" y="47" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">Họp Sprint Review K16 (Đã cập nhật mục tiêu mới)</text>
    </g>

    <!-- Field 2: Tag -->
    <g transform="translate(24, 185)">
      <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Nhãn cuộc họp (Tag)</text>
      <rect y="20" width="592" height="36" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="43" font-family="sans-serif" font-size="12" fill="#0f172a">Sprint 24</text>
    </g>

    <!-- Field 3: Time Box (Prefilled) -->
    <g transform="translate(24, 250)">
      <rect width="592" height="95" rx="8" ry="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">⏰ Thời gian họp (Giữ nguyên)</text>
      <rect x="16" y="38" width="170" height="36" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="28" y="61" font-family="sans-serif" font-size="13" fill="#0f172a">2026-10-10</text>
      <rect x="200" y="38" width="170" height="36" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="212" y="61" font-family="sans-serif" font-size="13" fill="#0f172a">09:00</text>
      <rect x="384" y="38" width="170" height="36" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="396" y="61" font-family="sans-serif" font-size="13" fill="#0f172a">10:30</text>
    </g>

    <!-- Field 4: Room (Prefilled) -->
    <g transform="translate(24, 360)">
      <text x="0" y="14" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">Phòng họp <tspan fill="#ef4444">*</tspan></text>
      <rect y="22" width="592" height="40" rx="6" ry="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="47" font-family="sans-serif" font-size="13" fill="#0f172a">Phòng Tokyo (Tầng 4) — Sức chứa: 20 người</text>
    </g>

    <!-- Modal Actions -->
    <g transform="translate(24, 450)">
      <rect x="470" width="122" height="40" rx="6" ry="6" fill="#2563eb"/>
      <text x="531" y="25" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff">💾 Cập nhật</text>
      <rect x="375" width="85" height="40" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="417" y="25" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Hủy</text>
    </g>
  </g>
  <rect x="680" y="600" width="200" height="28" rx="4" ry="4" fill="#2563eb"/>
  <text x="780" y="618" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">EVIDENCE: TC_EDIT_GEN_001</text>
</svg>